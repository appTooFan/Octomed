      .pdf-container {
        width: 100%;

<body>
    <div class="pdf-container" id="pdf-container"></div>

    <script>
    const section_Book_kind = window.localStorage.getItem("section_Book_kind");
    const path_Book_Subject = window.localStorage.getItem("path_Book_Subject_examsPapers")
  const path_Book_Index = window.localStorage.getItem("path_Book_Index_examsPapers");
 //  const  path_Temp = app.GetPrivateFolder( "temp" );
   //   const url = path_Temp+`/${section_Book_kind}/` + path_Book_Subject+"/"+ `${path_Book_Index}.pdf`;
   const url = window.localStorage.getItem("doctor_pdf_path");
   console.log(url)
// ثم اعرضه في الـ PDF viewer حسب طريقتك
const pdfjsLib = window['pdfjs-dist/build/pdf'];

pdfjsLib.GlobalWorkerOptions.workerSrc = '../js/pdf.worker.min.js';

let pdfDoc = null,
    pageNum = 10,
    scale = 1.5;

// Render the page
const renderPage = (page, canvasContainer) => {
  const viewport = page.getViewport({ scale });
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  canvas.height = viewport.height;
  canvas.width = viewport.width;

  const renderCtx = {
    canvasContext: ctx,
    viewport
  };

  canvasContainer.appendChild(canvas);

  page.render(renderCtx);
};

// Load PDF Document
pdfjsLib.getDocument(url).promise.then(pdfDoc_ => {
  
  pdfDoc = pdfDoc_
  const canvasContainer = document.getElementById('pdf-container');

  for (let i = 1; i <= pdfDoc.numPages; i++) {
    pdfDoc.getPage(i).then(page => {
      renderPage(page, canvasContainer);
    });
  }
});
